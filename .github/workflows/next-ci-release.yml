name: NEXT Python regression checks

on:
  pull_request:
  push:
    branches: [master, 'feature/**']

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test renderer
        run: python -m pip install 'Jinja2>=3.1,<4'
      - name: Compile Python
        run: python -m compileall -q twrpdtgen tests
      - name: Run unit regression checks
        run: python -m unittest discover -s tests -v

  preview-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish source-only prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="next-skeletons-v0.1.0"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "twrpdtgen-NEXT skeletons v0.1.0 (source preview)" \
            --notes-file docs/release-notes.md \
            --prerelease
