name: NEXT Python regression checks

on:
  pull_request:
  push:
    branches: [master, 'feature/**']

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install 'Jinja2>=3.1,<4' 'lz4>=4.3,<5' 'zstandard>=0.22,<1'
      - name: Validate launcher shell syntax
        run: |
          bash -n launcher.sh
          bash -n cloud-slice.sh
      - name: Validate Colab notebook JSON
        run: python -m json.tool colab/cloud_firmware_slice.ipynb >/dev/null
      - name: Validate cloud slicer CLI
        run: PYTHONPATH=. python -m twrpdtgen.cloud_slice --help >/dev/null
      - name: Compile Python
        run: python -m compileall -q twrpdtgen tests
      - name: Run unit regression checks
        run: python -m unittest discover -s tests -v
      - name: Run launcher self-test path
        env:
          TWRPDTGEN_SKIP_SYSTEM_DEPS: '1'
          TWRPDTGEN_SKIP_PIP: '1'
        run: bash launcher.sh --self-test

  colab-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exercise clone-and-run launcher bootstrap
        run: bash launcher.sh --doctor

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Windows launcher doctor
        shell: cmd
        run: launcher.cmd --doctor
      - name: Run Windows launcher regression suite
        shell: cmd
        run: launcher.cmd --self-test

  preview-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [tests, colab-bootstrap, windows-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish source-only prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'from twrpdtgen import __version__; print(__version__)')"
          tag="next-v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "twrpdtgen-NEXT ${version} (source preview)" \
            --notes-file docs/release-notes.md \
            --prerelease
