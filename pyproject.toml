[tool.poetry]
name = "twrpdtgen"
version = "3.1.0a19"
description = "Generate conservative TWRP device-tree skeletons from legacy and modern Android boot images"
authors = ["Sebastiano Barezzi <barezzisebastiano@gmail.com>", "twrpdtgen-NEXT contributors"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/RectifyData/twrpdtgen-NEXT"

[tool.poetry.scripts]
twrpdtgen = 'twrpdtgen.main:main'
twrpdtgen-cloud-slice = 'twrpdtgen.cloud_slice:main'
twrpdtgen-cloud-tree = 'twrpdtgen.cloud_tree:main'
twrpdtgen-easy = 'twrpdtgen.easy:main'
twrpdtgen-auto = 'twrpdtgen.auto_tree:main'

[tool.poetry.dependencies]
python = "^3.8"
GitPython = "^3.1.27"
Jinja2 = "^3.1.1"
sebaubuntu-libs = "^1.3.0"
lz4 = ">=4.3,<5"
zstandard = ">=0.22,<1"

[tool.poetry.dev-dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
